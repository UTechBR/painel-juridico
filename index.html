<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://www.gstatic.com https://cdn.sheetjs.com; style-src 'unsafe-inline'; connect-src https://comunicaapi.pje.jus.br https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com; img-src data:; base-uri 'none'; form-action 'none'">
<title>Processos judiciais · Única Promotora</title>
<style>
:root{--bg:#fff;--soft:#F4F4F4;--txt:#1A1A1A;--mut:#6B6B6B;--linha:#E3E3E3;--ac:#D5040C;--ac-bg:#FCEAEA;--al:#8a4b00;--al-bg:#FFF2DC;--ok:#1d6b43;--ok-bg:#E4F4EA;--err:#a11d2b;--err-bg:#FDEAEC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Arial,Helvetica,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.marca{font-size:12px;letter-spacing:.14em;font-weight:700;color:var(--mut);margin-bottom:8px}
.marca img{height:44px;display:block}
h1{font-size:26px;margin:0;font-weight:700}
h1 .v{color:var(--ac)}
.resumo{color:var(--mut);font-size:14px;margin-top:2px}
.resumo b{color:var(--ac)}
.quem{font-size:13px;color:var(--mut);text-align:right}
button,select{font:inherit;cursor:pointer;border:1px solid var(--linha);background:#fff;color:var(--txt);border-radius:6px;padding:7px 12px}
button:hover{border-color:#bdbdbd}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.pri:hover{background:#b60409}
button.link{border:0;background:none;color:var(--ac);padding:0;text-align:left;text-decoration:underline}
button:disabled{opacity:.5;cursor:default}
select{padding:5px 8px}
input,textarea{font:inherit;border:1px solid var(--linha);border-radius:6px;padding:7px 10px;background:#fff;color:var(--txt);width:100%}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
nav{display:flex;gap:2px;border-bottom:1px solid var(--linha);margin-bottom:14px;flex-wrap:wrap}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 14px;color:var(--mut)}
nav button[aria-current=true]{color:var(--txt);border-bottom-color:var(--ac);font-weight:700}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.barra input[type=search],.barra input[type=email]{max-width:280px}
.barra label.chk{display:flex;align-items:center;gap:6px;margin:0;color:var(--txt);font-size:14px}
.barra input[type=checkbox]{width:auto}
.esp{flex:1}
.msg{padding:9px 12px;border-radius:6px;margin-bottom:10px;font-size:14px}
.msg.info{background:var(--soft)}.msg.ok{background:var(--ok-bg)}.msg.al{background:var(--al-bg)}.msg.err{background:var(--err-bg)}
.tab{width:100%;border-collapse:collapse;border:1px solid var(--linha);border-radius:8px;overflow:hidden}
.tab th,.tab td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--linha);vertical-align:top}
.tab th{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:var(--soft)}
.tab tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--txt)}
.tag.al{background:var(--ac-bg);color:var(--ac);font-weight:700}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.mut{color:var(--mut)}
.vazio{padding:28px;text-align:center;color:var(--mut);background:var(--soft);border-radius:8px}
dialog{border:0;border-radius:10px;padding:0;width:min(820px,94vw);max-height:88vh;box-shadow:0 10px 40px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(26,26,26,.5)}
.dlg{padding:20px;overflow:auto;max-height:88vh}
.dlg h2{margin:0 0 4px;font-size:19px}
.com{border:1px solid var(--linha);border-radius:8px;padding:10px 12px;margin-top:10px}
.com.nova{background:#FFF7F7}
.com .l1{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-weight:700}
.com .acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:14px;align-items:center}
.com a{color:var(--ac)}
.teor{white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:6px;padding:10px;margin:8px 0 0;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;max-height:320px;overflow:auto}
.acesso{max-width:380px;margin:9vh auto;padding:0 16px}
.acesso .cx{border:1px solid var(--linha);border-radius:10px;padding:22px}
.abas{display:flex;gap:14px;margin:14px 0 4px;font-size:14px}
.abas button[aria-current=true]{font-weight:700;color:var(--txt);text-decoration:none}
@media(max-width:640px){.tab th:nth-child(n+4),.tab td:nth-child(n+4){display:none}.tab.usr th:nth-child(n+4),.tab.usr td:nth-child(n+4){display:table-cell}}

<script id="nucleo">
/* Regras puras (sem tela, sem rede): validação do número CNJ, leitura de arquivos/listas,
   limpeza do texto das publicações e agrupamento por processo. Testadas em tests/. */
window.NUCLEO = (function () {
  'use strict';
  const semAcento = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
  const soDigitos = s => String(s == null ? '' : s).replace(/\D/g, '');

  // Número CNJ: NNNNNNN-DD.AAAA.J.TR.OOOO. Dígito verificador: (NNNNNNN AAAA J TR OOOO DD) mod 97 == 1
  function cnjValido(d) {
    if (!/^\d{20}$/.test(d)) return false;
    const base = d.slice(0, 7) + d.slice(9, 13) + d.slice(13, 14) + d.slice(14, 16) + d.slice(16, 20) + d.slice(7, 9);
    return BigInt(base) % 97n === 1n;
  }
  function mascaraCnj(d) {
    return d.slice(0, 7) + '-' + d.slice(7, 9) + '.' + d.slice(9, 13) + '.' + d.slice(13, 14) + '.' + d.slice(14, 16) + '.' + d.slice(16, 20);
  }

  const RE_CNJ = /(?<!\d)\d{7}[-.\s]?\d{2}[.\s]?\d{4}[.\s]?\d[.\s]?\d{2}[.\s]?\d{4}(?!\d)/g;
  const RE_COL_BANCO = /^(banco|institui|credor|origem)/i;

  // Varre TODAS as células de cada planilha atrás de número CNJ válido (com ou sem máscara).
  // Só guarda o número e o banco: o resto do arquivo (cliente, CPF etc.) é ignorado.
  // O banco vem da coluna "Banco/Instituição/Credor/Origem" do cabeçalho ou do valor padrão informado.
  function extrairDeFolhas(folhas, opts) {
    opts = opts || {};
    const validos = [], invalidos = [], vistos = new Set();
    let repetidos = 0, numericas = 0;
    for (const linhas of folhas) {
      let colBanco = -1;
      linhas.forEach((cel, i) => {
        cel = (cel || []).map(c => (c == null ? '' : String(c)).replace(/^["']|["']$/g, '').trim());
        if (colBanco < 0 && i < 20) {
          const k = cel.findIndex(c => RE_COL_BANCO.test(c));
          if (k >= 0 && !cel.some(c => c.search(RE_CNJ) >= 0)) colBanco = k;
        }
        cel.forEach((c, j) => {
          if (/^\d{16,19}$/.test(c) || /^\d(\.\d+)?E\+(1[6-9]|2\d)$/i.test(c)) numericas++;
          for (const m of c.matchAll(RE_CNJ)) {
            const d = soDigitos(m[0]);
            if (!cnjValido(d)) { invalidos.push(m[0].slice(0, 40)); continue; }
            if (vistos.has(d)) { repetidos++; continue; }
            vistos.add(d);
            let banco = '';
            if (colBanco >= 0 && colBanco !== j) banco = cel[colBanco] || '';
            else if (opts.inferir) banco = cel.find((x, k) => k !== j && /[A-Za-zÀ-ÿ]/.test(x)) || '';
            if (!banco) banco = opts.bancoPadrao || '';
            validos.push({ numero: d, banco: banco.slice(0, 60) });
          }
        });
      });
    }
    return { validos, invalidos, repetidos, numericas };
  }
  function extrairDeLinhas(linhas, opts) { return extrairDeFolhas([linhas], opts); }
  function lerLista(texto, opts) {
    const linhas = String(texto || '').split(/\r?\n/).map(l => l.split(/\t|;|,/));
    return extrairDeLinhas(linhas, Object.assign({ inferir: true }, opts || {}));
  }

  // O teor vem como documento HTML de terceiros: vira texto puro (nunca é exibido como HTML).
  function limparTexto(html, parser) {
    const p = parser || new DOMParser();
    const doc = p.parseFromString(String(html || ''), 'text/html');
    doc.querySelectorAll('style,script,noscript,template').forEach(e => e.remove());
    return ((doc.body && doc.body.textContent) || '').replace(/\s+/g, ' ').trim();
  }
  function mascararCpf(t) {
    return String(t).replace(/(?<![\d.\-])\d{3}\.\d{3}\.\d{3}-\d{2}(?![\d\-])/g, '***.***.***-**');
  }
  function linkSeguro(u) {
    try { const x = new URL(String(u || '')); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : ''; } catch (e) { return ''; }
  }
  function nomesNormalizados(lista) {
    return (lista || []).map(n => semAcento(n).replace(/\b(LTDA|EIRELI|S\/A|SA|ME|EPP)\b\.?/g, '').replace(/\s+/g, ' ').trim()).filter(Boolean);
  }
  function ehNome(nome, nomesNorm) {
    const n = semAcento(nome);
    return nomesNorm.some(x => n.includes(x));
  }

  // Converte uma publicação da API no registro que vai para o banco (só os campos necessários).
  function normalizar(it, ctx) {
    const proc = soDigitos(it.numero_processo || it.numeroprocessocommascara);
    const completo = limparTexto(it.texto, ctx.parser);
    const cnpjOk = !!ctx.cnpj && (completo.includes(ctx.cnpj) ||
      new RegExp('(?<!\\d)' + soDigitos(ctx.cnpj) + '(?!\\d)').test(completo));
    const dest = (it.destinatarios || []).slice(0, 12).map(d => ({
      nome: String(d.nome || '').slice(0, 120), polo: String(d.polo || '').slice(0, 1)
    }));
    let papel = '';
    if (ctx.unica) {
      const d = dest.find(x => ehNome(x.nome, ctx.nomesNorm || []));
      papel = d && d.polo ? d.polo : 'C';
    }
    const s = (v, n) => String(v == null ? '' : v).slice(0, n);
    return {
      id: String(it.id),
      hash: /^[A-Za-z0-9]{8,64}$/.test(it.hash || '') ? it.hash : '',
      processo: proc,
      processoMasc: proc.length === 20 ? mascaraCnj(proc) : '',
      tribunal: s(it.siglaTribunal, 20),
      data: /^\d{4}-\d{2}-\d{2}$/.test(it.data_disponibilizacao || '') ? it.data_disponibilizacao : '',
      tipo: s(it.tipoComunicacao, 40),
      documento: s(it.tipoDocumento, 60),
      orgao: s(it.nomeOrgao, 120),
      classe: s(it.nomeClasse, 80),
      destinatarios: dest,
      link: linkSeguro(it.link),
      texto: mascararCpf(completo).slice(0, 4000),
      ativo: it.ativo !== false,
      carteira: !!ctx.carteira,
      unica: !!ctx.unica,
      cnpjOk: cnpjOk,
      papelUnica: papel,
      tratada: false, tratadaPor: '', tratadaEm: '',
      criadoEm: new Date().toISOString()
    };
  }

  // Só acrescenta marcações (nunca desfaz "tratada").
  function mudancas(ex, novo) {
    const m = {};
    if (novo.carteira && !ex.carteira) m.carteira = true;
    if (novo.unica && !ex.unica) m.unica = true;
    if (novo.unica && novo.cnpjOk && !ex.cnpjOk) m.cnpjOk = true;
    if (novo.unica && novo.papelUnica && novo.papelUnica !== ex.papelUnica) m.papelUnica = novo.papelUnica;
    if (novo.ativo === false && ex.ativo !== false) m.ativo = false;
    return m;
  }

  function agrupar(comms) {
    const mapa = new Map();
    for (const c of comms) {
      let g = mapa.get(c.processo);
      if (!g) {
        g = { processo: c.processo, mascara: '', tribunal: '', ultimaData: '', ultimoTipo: '', total: 0, pend: 0,
          unica: false, carteira: false, cnpjOk: false, papel: '', comms: [] };
        mapa.set(c.processo, g);
      }
      g.comms.push(c); g.total++;
      if (!c.tratada && c.ativo !== false) g.pend++;
      if (c.carteira) g.carteira = true;
      if (c.unica) {
        g.unica = true;
        if (c.cnpjOk) g.cnpjOk = true;
        if (c.papelUnica && (!g.papel || g.papel === 'C')) g.papel = c.papelUnica;
      }
      g.tribunal = g.tribunal || c.tribunal;
      g.mascara = g.mascara || c.processoMasc;
    }
    for (const g of mapa.values()) {
      g.comms.sort((a, b) => (b.data || '').localeCompare(a.data || '') || String(b.id).localeCompare(String(a.id)));
      g.ultimaData = g.comms[0].data; g.ultimoTipo = g.comms[0].tipo;
    }
    return mapa;
  }

  function somarDias(iso, n) {
    const [a, m, d] = iso.split('-').map(Number);
    const x = new Date(Date.UTC(a, m - 1, d + n));
    return x.toISOString().slice(0, 10);
  }
  function fmtData(iso) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
  function emailValido(e) { return /^[^\s@]{1,64}@[^\s@]{1,190}\.[^\s@]{2,}$/.test(String(e || '')) && String(e).length <= 254; }

  return { semAcento, soDigitos, cnjValido, mascaraCnj, extrairDeFolhas, extrairDeLinhas, lerLista, limparTexto, mascararCpf,
    linkSeguro, nomesNormalizados, ehNome, normalizar, mudancas, agrupar, somarDias, fmtData, emailValido };
})();
</script>

function botaoConfirmar(texto, acao, classe) {
  const b = h('button', { text: texto, class: classe || '' }); let t = null;
  b.addEventListener('click', () => {
    if (b.dataset.pronto) { clearTimeout(t); acao(); return; }

  });

}

    gravar: (c, id, dados, mesclar) => mesclar ? F.setDoc(F.doc(fs, c, id), dados, { merge: true }) : F.setDoc(F.doc(fs, c, id), dados),

/* ---------- API do DJEN (limite de 20/min por IP) ---------- */
const janela = []; let pausaAte = 0;
async function aguardarVaga() {
  for (;;) {
    const agora = Date.now();
    while (janela.length && agora - janela[0] > 60000) janela.shift();
    const espera = Math.max(pausaAte - agora, janela.length >= LIMITE_POR_MIN ? janela[0] + 60050 - agora : 0);
    if (espera <= 0) { janela.push(agora); return; }
    await dormir(Math.min(espera, 5000));
  }
}
async function chamarApi(params, tentativa = 0) {
  await aguardarVaga();
  const url = API + '/comunicacao?' + new URLSearchParams(params).toString();
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 30000);
  let r;
  try { r = await fetch(url, { signal: ctl.signal, credentials: 'omit', referrerPolicy: 'no-referrer' }); }
  catch (e) { clearTimeout(t); if (tentativa < 2) { await dormir(3000 * (tentativa + 1)); return chamarApi(params, tentativa + 1); } throw new Error('Sem conexão com o DJEN.'); }
  clearTimeout(t);
  if (r.status === 429) {
    pausaAte = Date.now() + 61000;
    if (tentativa < 3) return chamarApi(params, tentativa + 1);
    throw new Error('Limite de consultas do DJEN atingido. Tente em alguns minutos.');
  }
  const txt = await r.text(); let j = null;
  try { j = JSON.parse(txt); } catch (e) { /* o 500 "sistema ocupado" vem como HTML */ }
  if (r.status >= 500 || !j) {
    if (tentativa < 2) { await dormir(4000 * (tentativa + 1)); return chamarApi(params, tentativa + 1); }
    throw new Error('DJEN indisponível no momento.');
  }
  if (!r.ok) throw new Error('Consulta recusada pelo DJEN (código ' + r.status + ').');
  return j;
}
async function buscarTodas(params, onPagina) {
  const itens = [];
  for (let p = 1; p * 100 <= 10000; p++) {
    if (S.cancelar) break;
    const j = await chamarApi({ ...params, itensPorPagina: 100, pagina: p });
    const its = Array.isArray(j.items) ? j.items : [];
    itens.push(...its);
    if (onPagina) onPagina(itens.length);
    if (its.length < 100) break;
  }
  return itens;
}

/* ---------- Configuração compartilhada ---------- */
function configAtual() {
  const c = S.config || {};
  return {
    desde: /^\d{4}-\d{2}-\d{2}$/.test(c.desde || '') ? c.desde : N.somarDias(hojeISO(), -90),
    nomes: Array.isArray(c.nomes) && c.nomes.length ? c.nomes : NOMES_PADRAO,
    cnpj: /^\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}$/.test(c.cnpj || '') ? c.cnpj : CNPJ_PADRAO,
    ultimaAtualizacaoUnica: c.ultimaAtualizacaoUnica || ''
  };
}

/* ---------- Gravação das publicações ---------- */
async function salvarItens(itens, base) {
  const cfg = configAtual();
  const ctx = { ...base, nomesNorm: N.nomesNormalizados(cfg.nomes), cnpj: cfg.cnpj };
  let novos = 0; const tarefas = [];
  for (const it of itens) {
    if (!it || it.id == null) continue;
    const c = N.normalizar(it, ctx);
    if (c.processo.length !== 20) continue;
    const ex = S.indice.get(c.id);
    if (!ex) { S.indice.set(c.id, c); tarefas.push(armazem.gravar('comunicacoes', c.id, c, false)); novos++; }
    else { const m = N.mudancas(ex, c); if (Object.keys(m).length) tarefas.push(armazem.gravar('comunicacoes', c.id, m, true)); }
  }
  await Promise.all(tarefas);
  return novos;
}

/* ---------- Execução de tarefas longas ---------- */
async function executar(rotulo, fn) {
  if (S.rodando) return;
  S.rodando = true; S.cancelar = false; mostrarProgresso(rotulo + '…'); aviso('');
  try { await fn(); }
  catch (e) { aviso(e && e.message ? e.message : 'Algo deu errado. Tente novamente.', 'err'); }
  finally { S.rodando = false; mostrarProgresso(''); montarBarra(); }
}
async function consultarProcessos(lista) {
  let novos = 0, falhas = 0;
  for (let i = 0; i < lista.length; i++) {
    if (S.cancelar) break;
    const p = lista[i];
    mostrarProgresso('Consultando ' + (i + 1) + ' de ' + lista.length + ' · cerca de ' + Math.max(1, Math.ceil((lista.length - i) / LIMITE_POR_MIN)) + ' min restantes');
    try {
      const itens = await buscarTodas({ numeroProcesso: p.id });
      novos += await salvarItens(itens, { carteira: true, unica: false });
      await armazem.gravar('processos', p.id, { consultadoEm: new Date().toISOString() }, true);
      falhas = 0;
    } catch (e) { if (++falhas >= 3) throw new Error('Falhas seguidas ao consultar o DJEN. Tente de novo mais tarde.'); }
  }
  aviso((S.cancelar ? 'Interrompido. ' : 'Concluído. ') + novos + ' publicação(ões) nova(s).', novos ? 'ok' : 'info');
}
function atualizarCarteira() {
  const lista = [...S.processos].sort((a, b) => (a.consultadoEm || '').localeCompare(b.consultadoEm || ''));
  if (!lista.length) { aviso('Adicione processos primeiro.', 'al'); return; }
  executar('Consultando processos', () => consultarProcessos(lista));
}
function atualizarUnica() {
  if (!ehAdmin() && !S.config.cnpj) { aviso('O administrador precisa abrir Ajustes e clicar em Salvar uma vez antes da primeira busca.', 'al'); return; }
  executar('Buscando processos que citam a Única', async () => {
    const cfg = configAtual();
    const desde = cfg.ultimaAtualizacaoUnica ? N.somarDias(cfg.ultimaAtualizacaoUnica, -5) : cfg.desde;
    const mapa = new Map();
    const buscas = [...cfg.nomes.map(n => ({ nomeParte: n })), { texto: cfg.cnpj }];
    for (let i = 0; i < buscas.length; i++) {
      if (S.cancelar) throw new Error('Interrompido.');
      const rot = buscas[i].nomeParte ? 'nome "' + buscas[i].nomeParte + '"' : 'CNPJ';
      const its = await buscarTodas({ ...buscas[i], dataDisponibilizacaoInicio: desde }, n => mostrarProgresso('Busca por ' + rot + ': ' + n + ' publicações lidas'));
      its.forEach(it => mapa.set(String(it.id), it));
    }
    mostrarProgresso('Salvando…');
    const novos = await salvarItens([...mapa.values()], { carteira: false, unica: true });
    await armazem.gravar('config', 'geral', { ultimaAtualizacaoUnica: hojeISO() }, true);
    aviso('Concluído. ' + mapa.size + ' publicações encontradas desde ' + N.fmtData(desde) + ', ' + novos + ' nova(s).', novos ? 'ok' : 'info');
  });
}

/* ---------- Importar arquivos dos bancos ---------- */
let xlsxProm = null;
function carregarXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (xlsxProm) return xlsxProm;
  xlsxProm = new Promise((ok, falha) => {
    const s = document.createElement('script');
    s.src = XLSX_URL; s.integrity = XLSX_SRI; s.crossOrigin = 'anonymous';
    s.onload = () => ok(window.XLSX);
    s.onerror = () => { xlsxProm = null; falha(new Error('Não foi possível carregar o leitor de Excel. Salve o arquivo como CSV ou cole a lista.')); };
    document.head.append(s);
  });
  return xlsxProm;
}
async function lerArquivo(f) {
  if (f.size > 15 * 1024 * 1024) throw new Error('Arquivo muito grande (máximo 15 MB).');
  const nome = f.name.toLowerCase();
  if (/\.(xlsx|xlsm|xls)$/.test(nome)) {
    const X = await carregarXlsx();
    const wb = X.read(await f.arrayBuffer(), { type: 'array' });
    return wb.SheetNames.map(sn => X.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: '' }));
  }
  if (/\.(csv|txt)$/.test(nome)) return [(await f.text()).split(/\r?\n/).map(l => l.split(/\t|;|,/))];
  throw new Error('Formato não suportado. Envie Excel (.xlsx, .xls) ou CSV, ou cole a lista.');
}

    btnAdd.disabled = true; const lote = pend.slice();
    await Promise.all(lote.map(v => armazem.gravar('processos', v.numero, { numero: v.numero, mascara: N.mascaraCnj(v.numero), banco: v.banco,
      adicionadoPor: S.usuario, adicionadoEm: new Date().toISOString(), consultadoEm: '' }, false)));
    d.close(); executar('Consultando processos', () => consultarProcessos(lote.map(v => ({ id: v.numero }))));
  });
  d.replaceChildren(h('div', { class: 'dlg' }, h('h2', { text: 'Importar processos' }),
    h('div', { class: 'mut', text: 'Envie o arquivo do banco (Excel ou CSV). A ferramenta procura o número do processo em todas as colunas e guarda só o número e o banco; o restante do arquivo é ignorado.' }),
    h('label', { text: 'Arquivo' }), arq, h('label', { text: 'Banco (opcional)' }), banco, h('label', { text: 'ou lista colada' }), area,
    h('div', { class: 'barra', style: 'margin-top:12px' }, h('button', { text: 'Ler', onclick: ler })), res,
    h('div', { class: 'barra', style: 'margin-top:12px' }, btnAdd, h('span', { class: 'esp' }), h('button', { text: 'Fechar', onclick: () => d.close() }))));
  d.showModal();
}

/* ---------- Ajustes (admin) ---------- */
function formAjustes() {
  const cfg = configAtual();
  const desde = h('input', { type: 'date', value: cfg.desde, id: 'aj-desde' });
  const nomes = h('textarea', { rows: 3, id: 'aj-nomes' }); nomes.value = cfg.nomes.join('\n');
  const cnpj = h('input', { type: 'text', value: cfg.cnpj, id: 'aj-cnpj', inputmode: 'numeric' });
  const msg = h('div', {});
  return h('div', { style: 'max-width:560px' },
    h('label', { for: 'aj-nomes', text: 'Nomes da Única para buscar como parte (um por linha, até 5)' }), nomes,
    h('label', { for: 'aj-cnpj', text: 'CNPJ (com pontos e barra, como aparece no texto das publicações)' }), cnpj,
    h('label', { for: 'aj-desde', text: 'Na primeira busca, trazer publicações desde' }), desde,
    h('div', { class: 'barra', style: 'margin-top:12px' }, h('button', { class: 'pri', text: 'Salvar', onclick: async () => {
      const lista = nomes.value.split('\n').map(x => x.trim().toUpperCase()).filter(Boolean).slice(0, 5);
      if (!lista.length || lista.some(x => x.length > 120)) { msg.replaceChildren(h('div', { class: 'msg err', text: 'Informe de 1 a 5 nomes.' })); return; }
      if (!/^\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}$/.test(cnpj.value.trim())) { msg.replaceChildren(h('div', { class: 'msg err', text: 'CNPJ no formato 00.000.000/0000-00.' })); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(desde.value)) { msg.replaceChildren(h('div', { class: 'msg err', text: 'Informe uma data válida.' })); return; }
      await armazem.gravar('config', 'geral', { desde: desde.value, nomes: lista, cnpj: cnpj.value.trim(), ultimaAtualizacaoUnica: configAtual().ultimaAtualizacaoUnica }, false);
      msg.replaceChildren(h('div', { class: 'msg ok', text: 'Salvo.' }));
    } })), msg);
}

/* ---------- Usuários (admin) ---------- */
function formUsuario() {
  const em = h('input', { type: 'email', placeholder: 'e-mail da pessoa', 'aria-label': 'E-mail', maxlength: 254 });
  const pf = h('select', { 'aria-label': 'Perfil' }, h('option', { value: 'interno', text: 'Interno' }), h('option', { value: 'admin', text: 'Admin' }));
  const msg = h('div', {});
  return h('div', {}, h('div', { class: 'barra' }, em, pf, h('button', { class: 'pri', text: 'Cadastrar', onclick: async () => {
    const e = em.value.trim().toLowerCase();
    if (!N.emailValido(e)) { msg.replaceChildren(h('div', { class: 'msg err', text: 'Informe um e-mail válido.' })); return; }
    if (S.usuarios.some(u => u.id === e)) { msg.replaceChildren(h('div', { class: 'msg al', text: 'Esse e-mail já está cadastrado.' })); return; }
    await armazem.gravar('usuarios', e, { perfil: pf.value, ativo: true, criadoPor: S.usuario, criadoEm: new Date().toISOString() }, false);
    em.value = ''; msg.replaceChildren(h('div', { class: 'msg ok', text: 'Cadastrado. A pessoa entra em "Primeiro acesso" com este e-mail, cria a senha e confirma pelo link enviado por e-mail.' }));
  } })), msg);
}
function renderUsuarios(alvo) {
  const lista = [...S.usuarios].sort((a, b) => a.id.localeCompare(b.id));
  alvo.replaceChildren();
  if (!lista.length) { alvo.append(h('div', { class: 'vazio', text: 'Nenhum usuário cadastrado.' })); return; }
  alvo.append(h('table', { class: 'tab usr' }, h('thead', {}, h('tr', {}, ['E-mail', 'Perfil', 'Situação', ''].map(c => h('th', { scope: 'col', text: c })))),
    h('tbody', {}, lista.map(u => {
      const eu = u.id === S.usuario;
      const sel = h('select', { 'aria-label': 'Perfil de ' + u.id, onchange: e => armazem.gravar('usuarios', u.id, { perfil: e.target.value }, true) },
        h('option', { value: 'interno', text: 'Interno' }), h('option', { value: 'admin', text: 'Admin' }));
      sel.value = u.perfil;
      return h('tr', {},
        h('td', { text: u.id + (eu ? ' (você)' : '') }),
        h('td', {}, eu ? PERFIS[u.perfil] || u.perfil : sel),
        h('td', {}, h('span', { class: 'tag ' + (u.ativo ? 'ok' : ''), text: u.ativo ? 'Ativo' : 'Desativado' })),
        h('td', {}, eu ? null : [
          h('button', { class: 'link', text: u.ativo ? 'Desativar' : 'Reativar', onclick: () => armazem.gravar('usuarios', u.id, { ativo: !u.ativo }, true) }), ' ',
          botaoConfirmar('Remover', () => armazem.remover('usuarios', u.id), 'link')]));
    }))));
}

/* ---------- Acesso: login, primeiro acesso, confirmação de e-mail ---------- */
function telaAcesso(aba = 'entrar', msgInicial) {
  const raiz = $('#raiz'); raiz.replaceChildren();
  const email = h('input', { type: 'email', id: 'lg-email', autocomplete: 'username', required: true, maxlength: 254 });
  const senha = h('input', { type: 'password', id: 'lg-senha', autocomplete: aba === 'entrar' ? 'current-password' : 'new-password', maxlength: 128 });
  const conf = h('input', { type: 'password', id: 'lg-conf', autocomplete: 'new-password', maxlength: 128 });
  const caixa = h('div', {});
  const m = (t, tipo = 'err') => caixa.replaceChildren(h('div', { class: 'msg ' + tipo, text: t }));
  if (msgInicial) m(msgInicial.texto, msgInicial.tipo);
  const enviar = async ev => {
    ev.preventDefault();
    const em = email.value.trim().toLowerCase();
    if (aba === 'entrar') { try { await armazem.entrar(em, senha.value); } catch (e) { m('E-mail ou senha inválidos.'); } }
    else if (aba === 'primeiro') {
      if (senha.value.length < 10) return m('A senha precisa ter pelo menos 10 caracteres.');
      if (senha.value !== conf.value) return m('As senhas não conferem.');
      try { await armazem.criarConta(em, senha.value); } catch (e) { m('Não foi possível criar o acesso. Se você já tem cadastro, use "Esqueci a senha".'); }
    } else {
      try { await armazem.redefinir(em); } catch (e) { /* resposta neutra de propósito */ }
      m('Se o e-mail estiver cadastrado, enviamos um link para criar uma nova senha.', 'ok');
    }
  };
  const aba_ = (k, t) => h('button', { class: 'link', text: t, 'aria-current': String(aba === k), onclick: () => telaAcesso(k) });
  raiz.append(h('div', { class: 'acesso' }, cabecalhoMarca(), h('h1', {}, h('span', { class: 'v', text: 'Processos' }), ' judiciais'),
    h('div', { class: 'abas' }, aba_('entrar', 'Entrar'), aba_('primeiro', 'Primeiro acesso'), aba_('esqueci', 'Esqueci a senha')),
    h('form', { class: 'cx', onsubmit: enviar },
      aba === 'primeiro' ? h('div', { class: 'mut', text: 'Use o e-mail que o administrador cadastrou. Você vai receber um link para confirmar o e-mail.' }) : null,
      h('label', { for: 'lg-email', text: 'E-mail' }), email,
      aba === 'esqueci' ? null : [h('label', { for: 'lg-senha', text: aba === 'primeiro' ? 'Crie uma senha (mínimo 10 caracteres)' : 'Senha' }), senha],
      aba === 'primeiro' ? [h('label', { for: 'lg-conf', text: 'Repita a senha' }), conf] : null,
      h('div', { style: 'margin-top:12px' }, caixa),
      h('button', { class: 'pri', type: 'submit', text: aba === 'entrar' ? 'Entrar' : aba === 'primeiro' ? 'Criar acesso' : 'Enviar link' }))));
}
function telaMensagem(titulo, texto, ...botoes) {
  const raiz = $('#raiz'); raiz.replaceChildren();
  raiz.append(h('div', { class: 'acesso' }, cabecalhoMarca(), h('h1', {}, h('span', { class: 'v', text: 'Processos' }), ' judiciais'),
    h('div', { class: 'cx', style: 'margin-top:16px' }, h('h2', { text: titulo, style: 'margin:0 0 8px;font-size:18px' }), h('div', { text: texto }),
      h('div', { class: 'barra', style: 'margin-top:14px' }, ...botoes))));
}
function telaConfirmar() {
  telaMensagem('Falta confirmar o seu e-mail', 'Enviamos um link para ' + S.usuario + '. Clique nele e depois volte aqui.',
    h('button', { class: 'pri', text: 'Já confirmei', onclick: async () => { try { tratarUsuario(await armazem.recarregar()); } catch (e) { telaConfirmar(); } } }),
    h('button', { text: 'Reenviar link', onclick: async () => { try { await armazem.reenviarLink(); } catch (e) {} } }),
    h('button', { class: 'link', text: 'Sair', onclick: () => armazem.sair() }));
}
function telaSemAcesso() {
  telaMensagem('Acesso não liberado', 'O e-mail ' + S.usuario + ' ainda não foi liberado pelo administrador, ou o acesso foi desativado.',
    h('button', { class: 'link', text: 'Sair', onclick: () => armazem.sair() }));
}

/* ---------- Dados, sessão e inatividade ---------- */
let subDados = [], subPerfil = null, montado = false;
function limparSessao() {
  subDados.forEach(f => f && f()); subDados = []; if (subPerfil) subPerfil(); subPerfil = null; montado = false;
  S.processos = []; S.comms = []; S.indice = new Map(); S.config = {}; S.usuarios = []; S.perfil = ''; S.detalhe = null;
}
function assinarDados() {
  subDados.forEach(f => f && f()); subDados = [];
  const erro = () => aviso('Sem acesso aos dados. Confira se o seu e-mail está liberado ou tente novamente.', 'err');
  subDados.push(armazem.assinar('processos', d => { S.processos = d; render(); }, erro));
  subDados.push(armazem.assinar('comunicacoes', d => { S.comms = d; S.indice = new Map(d.map(x => [x.id, x])); render(); }, erro));
  subDados.push(armazem.assinar('config', d => { const g = d.find(x => x.id === 'geral'); S.config = g ? { ...g } : {}; montarBarra(); render(); }, erro));
  if (ehAdmin()) subDados.push(armazem.assinar('usuarios', d => { S.usuarios = d; render(); }, erro));
}
function tratarUsuario(u) {
  limparSessao();
  if (!u) { S.usuario = ''; telaAcesso(); return; }
  S.usuario = u.email;
  if (!u.verificado) { telaConfirmar(); return; }
  subPerfil = armazem.assinarDoc('usuarios', u.email, d => {
    if (!d || d.ativo !== true || !PERFIS[d.perfil]) { subDados.forEach(f => f && f()); subDados = []; montado = false; telaSemAcesso(); return; }
    const mudou = S.perfil !== d.perfil; S.perfil = d.perfil;
    if (!montado || mudou) { montado = true; ultimoUso = Date.now(); montarApp(); assinarDados(); }
  }, () => telaSemAcesso());
}
let ultimoUso = Date.now();
['click', 'keydown', 'mousemove', 'touchstart'].forEach(ev => addEventListener(ev, () => { ultimoUso = Date.now(); }, { passive: true }));
setInterval(() => { if (armazem && armazem.modo === 'firebase' && S.usuario && !S.rodando && Date.now() - ultimoUso > INATIVIDADE_MS) armazem.sair(); }, 30000);

(async function iniciar() {
  const configurado = Object.values(FIREBASE_CONFIG).every(v => v && !String(v).startsWith('COLE'));
  if (!configurado) { armazem = armazemLocal(); S.usuario = 'demonstração'; S.perfil = 'admin'; montado = true; montarApp(); assinarDados(); return; }
  try {
    armazem = await armazemFirebase();
    telaAcesso();
    armazem.aoMudarUsuario(tratarUsuario);
  } catch (e) { $('#raiz').replaceChildren(h('div', { class: 'wrap' }, h('div', { class: 'msg err', text: 'Não foi possível carregar o banco de dados. Confira a configuração e a conexão.' }))); }
})();
</script>
